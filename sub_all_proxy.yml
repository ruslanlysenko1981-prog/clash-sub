mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
proxies:
- name: 🚫 Subscription disabled
  type: vless
  server: 0.0.0.0
  port: 1
  uuid: 00000000-0000-0000-0000-000000000000
  udp: true
  tls: false
  skip-cert-verify: true
  network: tcp
proxy-groups:
- name: PROXIES
  type: select
  proxies:
  - AUTO
  - 🚫 Subscription disabled
- name: AUTO
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  proxies:
  - 🚫 Subscription disabled
rules:
- GEOIP,private,DIRECT
- GEOIP,lan,DIRECT
- MATCH,PROXIES

name: Convert Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl python3 python3-pip
          pip3 install pyyaml --break-system-packages || pip3 install pyyaml

      - name: Download Raw Sub
        run: |
          curl -s "https://sub.kushmakers.org/new/vhipHZeuGxXZfzJ9Z6ESUS" -o raw_config.json

      - name: Run Converter Script
        run: |
          python3 convert.py

      - name: Commit and Push all subscriptions
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sub*.yml
          git commit -m "Auto update all subscriptions" || exit 0
          git push

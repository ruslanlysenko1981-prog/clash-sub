name: Convert Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Subconverter Container
        run: |
          docker run -d --rm --name subconverter -p 25500:25500 tindy2013/subconverter:latest
          sleep 5

      - name: Download & Convert
        run: |
          curl -s "http://127.0.0.1:25500/sub?target=clash&url=https%3A%2F%2Fsub.kushmakers.org%2Fnew%2FvhipHZeuGxXZfzJ9Z6ESUS" -o sub.yml

      - name: Commit and Push sub.yml
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sub.yml
          git commit -m "Auto update sub.yml" || exit 0
          git push

name: Convert Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl python3

      - name: Run Subconverter Container
        run: |
          docker run -d --rm --name subconverter -p 25500:25500 tindy2013/subconverter:latest
          sleep 5

      - name: Extract VLESS Links and Convert to Clash
        run: |
          # 1. Скачиваем исходный JSON
          curl -s "https://sub.kushmakers.org/new/vhipHZeuGxXZfzJ9Z6ESUS" -o raw_config.json

          # 2. Парсим VLESS элементы из массива outbounds и формируем URI ссылки
          jq -r '.[] | .outbounds[]? | select(.protocol=="vless") | 
            "vless://" + .settings.vnext[0].users[0].id + "@" + .settings.vnext[0].address + ":" + (.settings.vnext[0].port|tostring) + 
            "?type=" + (.streamSettings.network // "tcp") + 
            "&security=" + (.streamSettings.security // "none") + 
            "&pbk=" + (.streamSettings.realitySettings.publicKey // "") + 
            "&fp=" + (.streamSettings.realitySettings.fingerprint // "chrome") + 
            "&sni=" + (.streamSettings.realitySettings.serverName // "") + 
            "&sid=" + (.streamSettings.realitySettings.shortId // "") + 
            "&flow=" + (.settings.vnext[0].users[0].flow // "") + 
            "#" + (.tag // "VLESS")' raw_config.json | sort -u > links.txt

          # 3. Кодируем полученный массив ссылок в Base64 и затем URL-encode для передачи в Subconverter
          BASE64_LINKS=$(cat links.txt | base64 -w 0)
          ENCODED_URL=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$BASE64_LINKS")

          # 4. Запрашиваем конвертацию у локального Subconverter
          curl -s "http://127.0.0.1:25500/sub?target=clash&url=${ENCODED_URL}" -o sub.yml

      - name: Commit and Push sub.yml
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sub.yml
          git commit -m "Auto update sub.yml" || exit 0
          git push
